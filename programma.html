<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programma · Reünie 25 jaar Scouting Brandevoort</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header id="kop"></header>
<main>
  <h1>Programma</h1>
  <p class="muted">Zondag 23 mei 2027 · 14:00 – 19:00 · blokhut de Brandnetel, Helmond<br><span id="agenda"></span></p>
  <div class="card text" id="inhoud"><p class="muted" style="margin:0">Laden…</p></div>
</main>
<footer id="voet"></footer>
<script src="reunie.js"></script>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
  $('agenda').innerHTML = Reunie.agenda();
  // programma.txt: "tijd | omschrijving" = programme item, other lines = paragraphs
  fetch('programma.txt', { cache: 'no-cache' }).then(r => r.text()).then(txt => {
    const E = Reunie.esc;
    let html = '', items = '';
    const flush = () => { if (items) { html += `<dl class="prog">${items}</dl>`; items = ''; } };
    for (let line of txt.split('\n')) {
      line = line.trim();
      if (!line || line.startsWith('#')) continue;
      const i = line.indexOf('|');
      if (i >= 0) items += `<dt>${E(line.slice(0, i).trim())}</dt><dd>${E(line.slice(i + 1).trim())}</dd>`;
      else { flush(); html += `<p>${E(line)}</p>`; }
    }
    flush();
    $('inhoud').innerHTML = html || '<p class="muted" style="margin:0">Het programma volgt.</p>';
  });
</script>
</body>
</html>
