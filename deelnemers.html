<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wie doen er mee? · Reünie 25 jaar Scouting Brandevoort</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header id="kop"></header>
<main>
  <h1>Wie doen er mee?</h1>
  <p class="muted" style="margin:0" id="totaal"></p>
  <div class="filters">
    <div class="seg"><button id="v-lijst" class="on">Lijst</button><button id="v-jaar">Per jaar</button></div>
    <input id="q" type="search" placeholder="Zoek op naam of speltak" aria-label="Zoek op naam, bijnaam of speltak (ook oude namen)">
    <select id="speltak" aria-label="Speltak"></select>
    <select id="jaar" aria-label="Jaar"></select>
  </div>
  <p class="summary" id="summary"></p>

  <div id="lijst">
    <div id="people"></div>
    <div id="zonder" hidden>
      <h3 class="sub">Ook ingeschreven</h3>
      <div class="people" id="people2"></div>
    </div>
  </div>

  <div id="perjaar" hidden>
    <p class="muted" style="margin:12px 0 0;font-size:14px">Aantal zichtbare jeugdleden per speltak per jaar, <b>L</b> = leiding. Klik op een vakje voor de namen.</p>
    <div class="scroll"><table class="ov" id="ov"></table></div>
  </div>
</main>
<dialog id="gz" class="card dialoog" aria-label="Foto's">
  <div class="gezichten" id="gz-fotos"></div>
  <p id="gz-naam" style="text-align:center;font-weight:700;margin:12px 0 4px"></p>
  <p id="gz-meld" style="text-align:center;margin:0;font-size:14px"></p>
  <form id="gz-form" hidden novalidate style="margin-top:10px">
    <label><span>Wat klopt er niet? <span class="muted" style="font-weight:400">(optioneel, alleen het comité ziet dit)</span></span>
      <textarea id="gz-reden" maxlength="500" style="min-height:70px"></textarea></label>
    <p class="muted" style="font-size:14px;margin:6px 0 0">Na het melden is de foto meteen niet meer te zien. Het comité kijkt ernaar.</p>
    <div class="acties"><button class="btn ghost" type="button" id="gz-terug">Annuleren</button><button class="btn danger" type="submit">Melden</button></div>
  </form>
  <div class="acties" id="gz-acties"><button class="btn ghost" type="button" id="gz-sluit">Sluiten</button></div>
</dialog>
<footer id="voet"></footer>
<script src="reunie.js"></script>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
  const NU = Reunie.NU;
  let PERSONEN = [], isZelf = () => false;
  const DOEL = /^#p-\d+$/.test(location.hash) ? location.hash : '';  // read before render() rewrites the URL

  // Anchor = position in the list; the home page gets the same list in the same order.
  const kaart = (p, hit) => Reunie.kaart(p, hit, isZelf(p), 'p-' + PERSONEN.indexOf(p), true);
  const grid = (titel, lijst, hit) => lijst.length
    ? `${titel ? `<h3 class="sub">${titel}</h3>` : ''}<div class="people">${lijst.map(p => kaart(p, hit)).join('')}</div>` : '';
  const naamVan = p => [p.voornaam, p.bijnaam, p.achternaam].filter(Boolean).join(' ').toLowerCase();

  function render() {
    const q = $('q').value.trim().toLowerCase(), t = $('speltak').value, j = +$('jaar').value;
    const hit = t || j ? Reunie.matcher(t, j) : null;
    // Name, nickname, or a speltak by any of its names ("verkenners" also finds the Scouts).
    const opNaam = p => !q || naamVan(p).includes(q) || !!p.takken?.some(r => Reunie.takPast(r, q));
    const lijst = PERSONEN.filter(p => !hit || p.takken?.some(hit)).filter(opNaam);

    if (hit) {
      // Leiding first: "who was my leiding at the Welpen in 2009?"
      const isLd = p => p.takken.some(r => r.rol === 'leiding' && hit(r));
      const ld = lijst.filter(isLd), lid = lijst.filter(p => !isLd(p));
      const kop = t && !Reunie.isRol(t) ? t : 'Jeugdleden';
      $('people').innerHTML = grid(ld.length ? 'Leiding' : '', ld, hit) + grid(ld.length ? Reunie.esc(kop) : '', lid, hit);
    } else {
      $('people').innerHTML = grid('', lijst, null);
    }
    if (!lijst.length) $('people').innerHTML = PERSONEN.length
      ? '<p class="muted">Niemand gevonden.</p>'
      : '<p class="muted">Nog niemand zichtbaar ingeschreven. <a href="inschrijven.html">Wees de eerste!</a></p>';

    // People who hide their speltakken can't match a speltak/year filter, but still want
    // to be seen: list them separately, the same for every filter (so nothing leaks).
    const zonder = hit ? PERSONEN.filter(p => !p.takken && (p.voornaam || p.achternaam || p.bijnaam || p.geboortejaar)).filter(opNaam) : [];
    $('zonder').hidden = !zonder.length;
    $('people2').innerHTML = zonder.map(p => kaart(p, null)).join('');

    const wat = t && j ? `${t} in ${j}` : t ? `Ooit bij ${t}` : j ? `Bij Brandevoort in ${j}` : '';
    $('summary').innerHTML = wat
      ? `<b>${Reunie.esc(wat)}:</b> ${lijst.length} ${lijst.length === 1 ? 'persoon' : 'mensen'} · <button class="linkbtn" id="reset">alles tonen</button>`
      : '';

    // Keep the filter in the URL so a filtered view can be shared
    const u = new URLSearchParams();
    if (t) u.set('speltak', t);
    if (j) u.set('jaar', j);
    history.replaceState(null, '', u.toString() ? '?' + u : location.pathname);
  }

  function renderPerJaar() {
    const namen = Reunie.takken().map(t => t.naam);
    const met = PERSONEN.filter(p => p.takken);
    const tel = (naam, j, rol) => met.filter(p => p.takken.some(r => (rol === 'lid') === (r.rol === 'lid') && Reunie.matcher(naam, j)(r))).length;
    const cel = {};
    let max = 1;
    for (let j = NU; j >= Reunie.opgericht(); j--) for (const n of namen) {
      const c = [tel(n, j, 'lid'), tel(n, j, 'leiding')];
      cel[j + n] = c; max = Math.max(max, c[0] + c[1]);
    }
    let rijen = '';
    for (let j = NU; j >= Reunie.opgericht(); j--) {
      rijen += `<tr><th class="y">${j}</th>` + namen.map(n => {
        const [lid, ld] = cel[j + n];
        if (!lid && !ld) return '<td><span class="muted">·</span></td>';
        const bg = `background: color-mix(in srgb, var(--brand) ${12 + 55 * (lid + ld) / max}%, transparent)`;
        const txt = [lid || '', ld ? `<small>${ld}L</small>` : ''].filter(Boolean).join(' · ');
        return `<td><button style="${bg}" data-speltak="${Reunie.esc(n)}" data-jaar="${j}">${txt}</button></td>`;
      }).join('') + '</tr>';
    }
    $('ov').innerHTML = `<thead><tr><th></th>${namen.map(n => `<th>${Reunie.esc(n)}</th>`).join('')}</tr></thead><tbody>${rijen}</tbody>`;
  }

  function view(v) {
    $('lijst').hidden = v !== 'lijst'; $('perjaar').hidden = v !== 'jaar';
    $('v-lijst').classList.toggle('on', v === 'lijst'); $('v-jaar').classList.toggle('on', v === 'jaar');
  }
  $('v-lijst').addEventListener('click', () => view('lijst'));
  $('v-jaar').addEventListener('click', () => view('jaar'));
  $('ov').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    $('speltak').value = b.dataset.speltak; $('jaar').value = b.dataset.jaar;
    view('lijst'); render(); scrollTo(0, 0);
  });
  $('summary').addEventListener('click', e => {
    if (e.target.id === 'reset') { $('speltak').value = ''; $('jaar').value = ''; render(); }
  });
  ['q', 'speltak', 'jaar'].forEach(id => $(id).addEventListener('input', render));

  // ---- profile photos (toen en nu): only logged-in participants get the paths ----
  let comite = false;
  async function gezichten() {
    const paden = PERSONEN.flatMap(p => [p.foto_toen, p.foto_nu]).filter(Boolean).map(x => x + '.jpg');
    if (!paden.length) return;
    const urls = await Data.fotoUrls(paden).catch(() => ({}));
    for (const p of PERSONEN) zetGezicht(p, urls);
    comite = await Data.beheerder().catch(() => false);
  }
  function zetGezicht(p, urls) {
    const g = { toen: p.foto_toen && urls[p.foto_toen + '.jpg'], nu: p.foto_nu && urls[p.foto_nu + '.jpg'] };
    p.gezicht = g.toen || g.nu ? g : null;
  }
  let groot = null;     // the person in the big view
  function toonGezicht(p) {
    groot = p;
    $('gz-fotos').innerHTML = ['toen', 'nu'].filter(s => p.gezicht?.[s]).map(s => `<figure>
        <img src="${Reunie.esc(p.gezicht[s])}" alt="Foto van ${s}"><figcaption>${s}${comite
          ? ` · <button type="button" class="linkbtn" data-weg="${s}">Weghalen</button>` : ''}</figcaption></figure>`).join('');
    $('gz-naam').textContent = Reunie.naam(p) || 'Anoniem';
    $('gz-meld').innerHTML = comite ? '' : '<button type="button" class="linkbtn zacht" id="gz-meldknop">Klopt er iets niet met deze foto? Meld het</button>';
    $('gz-form').hidden = true; $('gz-acties').hidden = false; $('gz-reden').value = '';
    if (!$('gz').open) $('gz').showModal();
  }
  ['people', 'people2'].forEach(id => $(id).addEventListener('click', e => {
    const b = e.target.closest('button[data-gezicht]');
    const n = b && +b.closest('.person')?.id.slice(2);
    if (b && PERSONEN[n]) toonGezicht(PERSONEN[n]);
  }));
  $('gz-sluit').addEventListener('click', () => $('gz').close());
  $('gz').addEventListener('click', e => { if (e.target === $('gz')) $('gz').close(); });
  $('gz-meld').addEventListener('click', e => {
    if (e.target.id !== 'gz-meldknop') return;
    $('gz-form').hidden = false; $('gz-acties').hidden = true; $('gz-meld').innerHTML = '';
    $('gz-reden').focus();
  });
  $('gz-terug').addEventListener('click', () => toonGezicht(groot));
  // Hide the photo(s) on this page at once; the comité decides afterwards.
  function haalWeg(p, soorten) {
    for (const s of soorten) p['foto_' + s] = null;
    if (p.gezicht) { for (const s of soorten) p.gezicht[s] = null; if (!p.gezicht.toen && !p.gezicht.nu) p.gezicht = null; }
    render();
  }
  $('gz-form').addEventListener('submit', async e => {
    e.preventDefault();
    const p = groot, soorten = ['toen', 'nu'].filter(s => p['foto_' + s]);
    const knop = e.submitter; if (knop) knop.disabled = true;
    try {
      for (const s of soorten) await Data.meldProfielfoto(p['foto_' + s], $('gz-reden').value);
      $('gz').close();
      haalWeg(p, soorten);
      $('summary').insertAdjacentHTML('afterend', '<p class="note ok" id="gz-bedankt">Dank je wel voor je melding. De foto is niet meer te zien.</p>');
      setTimeout(() => $('gz-bedankt')?.remove(), 8000);
    } catch (err) { alert('Melden lukte niet: ' + err.message); }
    if (knop) knop.disabled = false;
  });
  $('gz-fotos').addEventListener('click', async e => {
    const s = e.target.dataset.weg;
    if (!s || !confirm(`Deze foto van ${s} weghalen? Hij wordt meteen gewist.`)) return;
    e.target.disabled = true;
    try {
      await Data.beoordeelProfielfoto(groot['foto_' + s], 'weghalen');
      haalWeg(groot, [s]);
      groot.gezicht ? toonGezicht(groot) : $('gz').close();
    } catch (err) { alert('Weghalen lukte niet: ' + err.message); e.target.disabled = false; }
  });

  (async () => {
    await Reunie.laadSpeltakken();
    $('speltak').innerHTML = '<option value="">Alle speltakken</option>' +
      Reunie.takken().map(t => `<option value="${Reunie.esc(t.naam)}">${Reunie.esc(t.naam)}${t.oud.length
        ? ` (${Reunie.esc(t.oud.slice(0, 2).join(', '))}${t.oud.length > 2 ? ', …' : ''})` : ''}</option>`).join('');
    let jaren = '<option value="">Alle jaren</option>';
    for (let j = NU; j >= Reunie.opgericht(); j--) jaren += `<option>${j}</option>`;
    $('jaar').innerHTML = jaren;

    const u = new URLSearchParams(location.search);
    $('speltak').value = u.get('speltak') || '';
    $('jaar').value = u.get('jaar') || '';

    const [d, ik] = await Promise.all([Data.deelnemers(), Data.ingelogd() ? Data.ik().catch(() => null) : null]);
    isZelf = Reunie.zelf(ik);
    PERSONEN = d.personen;
    await gezichten();
    $('totaal').innerHTML = `<b>${d.totaal}</b> ${d.totaal === 1 ? "doet" : "doen"} mee · ${Reunie.erbijTekst(d.erbij)} · <b>${PERSONEN.length}</b> zichtbaar`;
    render(); renderPerJaar();

    // From a name on the home page (#p-3): scroll to that card and light it up briefly.
    const doel = DOEL && document.querySelector(DOEL);
    if (doel) {
      doel.scrollIntoView({ block: 'center' });
      doel.classList.add('gevonden');
    }
  })();
</script>
</body>
</html>
